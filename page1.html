<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>

  <style>
    body {
      background-color: black;
      color: white;
      font-family: 'Times New Roman', Times, serif;
      height: 300vh;
    }

    #intro {
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 0px;
    }

    #intro img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        animation: fadeinout linear;
        animation-timeline: scroll();
        animation-range: 0px 2000px;
        margin: 0;
    }

    #intro p {
        font-size: 80px;
        line-height: 1;
        text-decoration: underline wheat 3px;
        letter-spacing: 2px;
        animation: fadeinout linear;
        animation-timeline: scroll();
        animation-range: 0px 2000px;
        margin: 0;
        line-height: 1.5;
    }

    @keyframes fadeinout {
        0%   { opacity: 0; }
        40%  { opacity: 1; }
        70%  { opacity: 0; }
        100% { opacity: 0; }
    }

    .scroll-hint {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
        color: #555;
        font-size: 14px;
        letter-spacing: 3px;
    }
  </style>
</head>
<body>

  <div id="intro">
    <img src="img.jpg" alt="My Photo" />
    <p>Jeevita</p>
  </div>

  <p class="scroll-hint">SCROLL DOWN</p>

</body>
</html>
